name: LocusSweep
options:
  objectVersion: 56
  xcodeVersion: "15.0"
  bundleIdPrefix: studio.locusable
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: studio.locusable.LocusSweep
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: LocusSweep
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Locusable Studio"
    INFOPLIST_KEY_LSUIElement: NO
targets:
  LocusSweep:
    type: application
    platform: macOS
    sources:
      - path: LocusSweep
        excludes:
          - "**/*.md"
      - path: Sources/LocusSweepCore
    settings:
      base:
        PRODUCT_NAME: LocusSweep
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: YES
